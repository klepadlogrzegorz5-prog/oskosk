name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v3

      - name: Nadanie uprawnień do skryptu Gradle
        run: chmod +x gradlew

      - name: Budowanie APK (Debug)
        run: ./gradlew assembleDebug

      - name: Przesłanie pliku APK jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
