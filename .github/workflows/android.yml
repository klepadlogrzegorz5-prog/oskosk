name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # ręczne uruchomienie z GitHub

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Kod
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Android SDK (oficjalne, stabilne)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Uprawnienia
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Budowa APK
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      # 6. Pokaż co powstało (pomaga przy debugowaniu)
      - name: List generated APKs
        if: always()
        run: |
          echo "=== Znalezione pliki APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "Brak plików APK"
          echo ""
          echo "=== Zawartość katalogu debug ==="
          ls -lah app/build/outputs/apk/debug/ 2>/dev/null || echo "Katalog nie istnieje"

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
